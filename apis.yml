aid: zkme
name: zkMe
description: >-
  zkMe is a decentralized identity network delivering privacy-preserving
  compliance for Web3. Using zero-knowledge proofs, self-sovereign identity (SSI)
  wallets, DID methods and soulbound tokens, zkMe lets applications verify their
  users and businesses without ever handling raw personal data. Its product
  suite spans zkKYC (customer identity with sanction, age, citizenship, location
  and uniqueness/anti-Sybil proofs), zkKYB (business entity and UBO
  verification), zkOBS (open-banking proof of accredited investor and proof of
  address), and KYT (on-chain wallet-address and transaction risk screening).
  Verification runs client-side through embeddable JavaScript and mobile widgets;
  integrators then query outcomes through the zkMe Open API on agw.zk.me using an
  AppID + API key pair. zkMe also publishes zkTLS verifier SDKs, DID
  registry/resolver tooling and smart contracts through its zkMeLabs GitHub org.
